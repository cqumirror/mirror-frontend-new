name: Build and Package Static Site

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --ignore-scripts

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE: https://mirrors.cqu.edu.cn

      - name: Verify runtime data is not packaged
        shell: bash
        run: |
          for file in \
            dist/api/getip \
            dist/static/isoinfo.json \
            dist/static/release-manifest.json \
            dist/static/tunasync.json; do
            if [[ -e "$file" ]]; then
              echo "::error file=$file::Runtime-only data was copied into dist"
              exit 1
            fi
          done

      - name: Package build
        shell: bash
        run: |
          mkdir -p artifacts
          package_name="mirror-site-${GITHUB_SHA:0:7}.tar.gz"
          tar -czf "artifacts/${package_name}" -C dist .

      - name: Upload packaged artifact
        uses: actions/upload-artifact@v4
        with:
          name: mirror-site-${{ github.run_number }}-${{ github.sha }}
          path: artifacts/*.tar.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
